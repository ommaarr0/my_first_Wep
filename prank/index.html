<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حجر، ورقة، مقص 🎮</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .score-board {
            display: flex;
            gap: 30px;
            font-size: 18px;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .choices {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .choice-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .choice-btn:hover {
            background: #38bdf8;
            transform: scale(1.1);
        }

        #resultArea {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 60px;
        }
    </style>
</head>
<body>

    <h1>لعبة حجر، ورقة، مقص ✊✌️✋</h1>

    <div class="score-board">
        <div>نقاطك: <span id="playerScore">0</span></div>
        <div>نقاط الكمبيوتر: <span id="computerScore">0</span></div>
    </div>

    <p>اختر حركتك:</p>
    <div class="choices">
        <button class="choice-btn" onclick="play('حجر')">✊ حجر</button>
        <button class="choice-btn" onclick="play('ورقة')">✋ ورقة</button>
        <button class="choice-btn" onclick="play('مقص')">✌️ مقص</button>
    </div>

    <div id="resultArea">استعد للعب...</div>

    <script>
        let pScore = 0;
        let cScore = 0;

        function play(playerChoice) {
            const options = ['حجر', 'ورقة', 'مقص'];
            const computerChoice = options[Math.floor(Math.random() * 3)];

            const resultArea = document.getElementById('resultArea');
            let roundResult = "";

            if (playerChoice === computerChoice) {
                roundResult = `تعادل! 🤝 الاتنين اخترتوا (${playerChoice})`;
                resultArea.style.color = "#fbbf24";
            } else if (
                (playerChoice === 'حجر' && computerChoice === 'مقص') ||
                (playerChoice === 'ورقة' && computerChoice === 'حجر') ||
                (playerChoice === 'مقص' && computerChoice === 'ورقة')
            ) {
                roundResult = `كسبت الجولة! 🎉 أنت (${playerChoice}) والكمبيوتر (${computerChoice})`;
                pScore++;
                resultArea.style.color = "#4ade80";
            } else {
                roundResult = `خسرت الجولة! 😢 أنت (${playerChoice}) والكمبيوتر (${computerChoice})`;
                cScore++;
                resultArea.style.color = "#f43f5e";
            }

            document.getElementById('playerScore').innerText = pScore;
            document.getElementById('computerScore').innerText = cScore;
            resultArea.innerHTML = roundResult;
        }
    </script>

</body>
</html>
